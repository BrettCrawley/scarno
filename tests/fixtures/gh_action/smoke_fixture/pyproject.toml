[project]
name = "gh-action-smoke"
version = "0.1.0"
description = "Tiny Python project exercised by the REQ-8 GitHub Action smoke workflow."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
