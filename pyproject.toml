[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scarno"
version = "1.0.1"
description = "Smart dependency pruner for Python, Java, JavaScript, Go, C#, and CSS projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Brett Crawley" }]
keywords = [
    "dependencies",
    "dependency-analysis",
    "dead-code",
    "unused-dependencies",
    "static-analysis",
    "tree-sitter",
    "diamond-dependencies",
    "transitive-dependencies",
    "dependency-bloat",
    "breaking-changes",
    "abi-compatibility",
    "semver",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "gitignorefile>=1.0",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-css==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-c-sharp==0.23.5",
    # REQ-24 — opt-in OS-trust-store TLS via ``--native-tls`` (same
    # package uv, pip, hatch, and pdm use). Only imported when the
    # flag is set; without it, scarno uses
    # ``ssl.create_default_context`` exactly as before.
    "truststore>=0.10",
]

[project.urls]
Homepage = "https://github.com/BrettCrawley/scarno"
Repository = "https://github.com/BrettCrawley/scarno"
Documentation = "https://github.com/BrettCrawley/scarno#readme"
Issues = "https://github.com/BrettCrawley/scarno/issues"

[project.scripts]
scarno = "scarno.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-setuptools>=70.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scarno"]

[tool.pytest.ini_options]
# Coverage runs on every `pytest` invocation (FR-085).
# Override at call site with `--no-cov` when profiling a single test.
addopts = """\
--strict-markers \
-ra \
--cov=src/scarno \
--cov-report=term-missing:skip-covered \
--cov-report=xml \
--cov-report=html \
"""
testpaths = ["tests"]
markers = [
    "security: adversarial and security control tests",
    "integration: trust boundary integration tests",
    "performance: resource bound and timing tests",
    "requirement(req_id): traceability marker linking a test to an SRTM requirement ID",
    "srtm: any test participating in SRTM coverage (usually applied indirectly via requirement)",
]

[tool.coverage.run]
source = ["src/scarno"]
omit = ["tests/*", "src/scarno/__main__.py"]

[tool.coverage.report]
show_missing = true
# All phases (0a → 7) complete. Floor enforced at 85%.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["src/scarno"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/scarno"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
