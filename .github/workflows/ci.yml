name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: install exactly what uv.lock records and fail if the lockfile
        # is stale, so every job in every run resolves to the same dependency
        # set. Refresh with `uv lock` when pyproject.toml changes.
        run: uv sync --all-extras --dev --locked

      - name: Run pytest with coverage
        # Coverage (term + xml + html) is produced unconditionally via
        # pyproject.toml addopts, so this just runs the suite.
        run: uv run pytest tests/

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error

  srtm-coverage:
    name: SRTM coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: install exactly what uv.lock records and fail if the lockfile
        # is stale, so every job in every run resolves to the same dependency
        # set. Refresh with `uv lock` when pyproject.toml changes.
        run: uv sync --all-extras --dev --locked

      - name: Collect SRTM coverage and fail on gaps
        # Full run (not --collect-only) so the coverage gate measures real
        # execution instead of aborting at ~16%; the SRTM plugin harvests
        # requirement markers during the same run and fails on any gap.
        run: |
          uv run pytest tests/ \
            -q \
            --srtm-report=srtm-coverage.json \
            --srtm-fail-on-gap

      - name: Upload SRTM coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srtm-coverage
          path: srtm-coverage.json
          if-no-files-found: ignore

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: install exactly what uv.lock records and fail if the lockfile
        # is stale, so every job in every run resolves to the same dependency
        # set. Refresh with `uv lock` when pyproject.toml changes.
        run: uv sync --all-extras --dev --locked

      - name: Run mypy
        run: uv run mypy src/scarno

  bandit:
    name: bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: install exactly what uv.lock records and fail if the lockfile
        # is stale, so every job in every run resolves to the same dependency
        # set. Refresh with `uv lock` when pyproject.toml changes.
        run: uv sync --all-extras --dev --locked

      - name: Run bandit
        run: uv run bandit -r src/ -ll

  pip-audit:
    name: pip-audit CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        # --locked: install exactly what uv.lock records and fail if the lockfile
        # is stale, so every job in every run resolves to the same dependency
        # set. Refresh with `uv lock` when pyproject.toml changes.
        run: uv sync --all-extras --dev --locked

      - name: Run pip-audit
        # Audit the installed environment for known CVEs. --skip-editable
        # excludes the local scarno project (not on PyPI, so unauditable).
        # --strict is intentionally omitted: it fails on ANY skipped dist,
        # which would include the editable project — incompatible with
        # --skip-editable. A real vulnerability still fails the job.
        run: uv run pip-audit --skip-editable

  opengrep:
    name: opengrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install opengrep
        run: |
          # opengrep_manylinux_x86 is the standalone glibc x86_64 binary
          # (the old opengrep-linux-x64 asset no longer exists). --fail so a
          # bad URL errors here instead of writing an HTML/error page that
          # then fails to execute with a confusing exit 127.
          curl -fL https://github.com/opengrep/opengrep/releases/latest/download/opengrep_manylinux_x86 \
            -o /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      - name: Run opengrep
        run: opengrep scan --config .opengrep/rules/ src/
